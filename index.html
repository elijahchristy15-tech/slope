<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slope Leaderboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #000 0%, #050505 60%, #000 100%);
    color: #00ff88;
    text-align: center;
}

/* glowing title */
h1 {
    margin-top: 30px;
    font-size: 3em;
    text-shadow:
        0 0 10px #00ff88,
        0 0 20px #00ff88,
        0 0 40px #00ff88;
}

/* slope grid background */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(#00ff8833 1px, transparent 1px),
        linear-gradient(90deg, #00ff8833 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(400px) rotateX(60deg);
    top: 40%;
    z-index: -1;
}

/* leaderboard box */
table {
    margin: 40px auto;
    width: 60%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.7);
    box-shadow: 0 0 20px #00ff88;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #00ff8855;
}

th {
    background: #001a11;
}

/* glowing hover */
tr:hover {
    background: #003322;
    transform: scale(1.02);
}

/* medals */
tr:nth-child(1) {
    color: #00ff88;
    font-weight: bold;
    text-shadow: 0 0 10px #00ff88;
}

tr:nth-child(2) { color: #66ffaa; }
tr:nth-child(3) { color: #99ffcc; }
</style>
</head>

<body>

<h1>⚡ SLOPE LEADERBOARD ⚡</h1>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Score</th>
</tr>
</thead>
<tbody id="leaderboard"></tbody>
</table>

<script>
/*
=========================
ONLY EDIT THIS SECTION
=========================
*/
const players = [
    { name: "Eli", score: 324 },
    { name: "SpeedRunner", score: 290 },
    { name: "NeonPlayer", score: 210 },
    { name: "TestUser", score: 150 }
];

/* auto sort */
players.sort((a,b)=>b.score-a.score);

const board = document.getElementById("leaderboard");

players.forEach((p,i)=>{
    const row=document.createElement("tr");
    row.innerHTML=`
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.score}</td>
    `;
    board.appendChild(row);
});
</script>

</body>
</html>
